# Scheduled market-data crawler: scrapes enabled sources, updates the SQLite
# database and JSON exports, and commits them. The commit to main triggers the
# Pages workflow, so the live site refreshes automatically.
#
# NOTE: cron schedules only run on the repository's default branch (main), so
# this activates once the branch is merged. Use "Run workflow" for manual runs.
name: Scrape market data

on:
  schedule:
    - cron: '17 1,7,13,19 * * *' # every 6 hours
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max index pages per source'
        default: '3'

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run parser tests
        run: npm run scrape:test
      - name: Crawl sources
        run: node scraper/cli.js --max-pages=${{ github.event.inputs.max_pages || 3 }}
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.db public/data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): scheduled market data update"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
